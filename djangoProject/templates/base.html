<!DOCTYPE html>
<html lang="en">
<head>
     {% load static %}
    <link rel="stylesheet" href="{% static 'CSS/base.css' %}">
   
   {% block extra_styles %}{% endblock extra_styles %}
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<nav class="navigation">
    <div class="nav-logo">
        <a href="/">
            <img src="{% static 'images/car.svg' %}" alt="Car Price Predictor logo"/>
        </a>
        <p>Car Price Predictor</p>
    </div>
    <div class="nav-content">
    <div>
        <a href="/">
        <button class="nav_button">Home</button>
        </a>
    </div>
    <div>
        <a href="/upload_image">
        <button class="nav_button">Image upload</button>
        </a>
    </div>
    <div id="loginLogoutDiv">
        <!-- Button will be dynamically replaced here by JS -->
        <button id="loginLogoutButton" class="nav_button">Login</button>
    </div>
    </div>
</nav>

{% block content %}
{% endblock %}

<nav class="bottom_navigation">
    <div class="contact_us">
        <h3>Contact us</h3>
        <p>Email: support@carpricepredictor.com</p>
        <p>Phone: +1 234 567 890</p>
    </div>
    <div class="follow_us">
        <h3>Follow us</h3>
        <div class="follow_icons">
            <img src="{% static 'images/icons8-facebook.svg' %}" alt="facebook"/>
            <img src="{% static 'images/icons8-instagram.svg' %}" alt="instagram"/>
            <img src="{% static 'images/icons8-tik-tok.svg' %}" alt="tik tok"/>
        </div>
    </div>
    <div class="resources">
        <h3>Resources</h3>
        <p><a>Privacy Policy</a></p>
        <p><a>Terms of Service</a></p>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginLogoutButton = document.getElementById('loginLogoutButton');
        const loginLogoutDiv = document.getElementById('loginLogoutDiv');
        const token = window.localStorage.getItem('authToken');

        // If the token exists, show the Logout button
        if (token) {
            loginLogoutButton.textContent = 'Logout';
            loginLogoutButton.onclick = async () => {
                try {
                    const response = await fetch('/api/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Token ${token}`,
                            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                        }
                    });

                    const result = await response.json();
                    if (response.ok) {
                        // Successfully logged out, remove token from localStorage
                        window.localStorage.removeItem('authToken');
                        // Redirect to home page
                        window.location.href = '/';
                    } else {
                        // Handle error response
                        alert(result.error || 'Logout failed');
                    }
                } catch (error) {
                    alert('An error occurred during logout');
                }
            };
        } else {
            loginLogoutButton.textContent = 'Login';
            loginLogoutButton.onclick = () => {
                window.location.href = '/login'; // Redirect to login page
            };
        }
    });
</script>
</body>
</html>
